<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#12192c" />
    </linearGradient>
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141d33" />
      <stop offset="100%" stop-color="#0f1627" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />
  <g stroke="#1a253a" stroke-width="1" opacity="0.4">
    <line x1="0" y1="75" x2="1200" y2="75" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="225" x2="1200" y2="225" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="375" x2="1200" y2="375" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="0" y1="600" x2="1200" y2="600" />
  </g>

  <!-- Top App Bar -->
  <rect x="0" y="0" width="1200" height="70" fill="#0d1426" stroke="#243452" stroke-width="1" />
  <rect x="25" y="15" width="40" height="40" rx="8" fill="url(#cyanBlueGrad)" filter="url(#glow)" />
  <text x="45" y="42" fill="#0a0f1d" font-family="Inter, sans-serif" font-weight="900" font-size="22" text-anchor="middle">🏢</text>
  <text x="80" y="38" fill="#ffffff" font-family="Inter, sans-serif" font-weight="800" font-size="19">LonWorksForge Pro</text>
  <text x="80" y="54" fill="#94a3b8" font-family="Inter, sans-serif" font-weight="500" font-size="12">ANSI/CTA-709.1 LonTalk Protocol &amp; SNVT Network Engineering Studio (LonMark Interoperable)</text>

  <!-- Status Chip -->
  <rect x="920" y="18" width="255" height="34" rx="17" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1" />
  <circle cx="938" cy="35" r="5" fill="#10b981" />
  <text x="952" y="40" fill="#10b981" font-family="Inter, sans-serif" font-weight="600" font-size="12">ANSI/CTA-709.1 &amp; EIA-852 Verified</text>

  <!-- Nav Tabs -->
  <rect x="0" y="70" width="1200" height="45" fill="#0a1222" stroke="#243452" stroke-width="1" />
  <text x="40" y="98" fill="#00f2fe" font-family="Inter, sans-serif" font-weight="700" font-size="13">SNVT Network Variables</text>
  <line x1="35" y1="113" x2="200" y2="113" stroke="#00f2fe" stroke-width="3" />
  <text x="235" y="98" fill="#94a3b8" font-family="Inter, sans-serif" font-weight="600" font-size="13">Peer-to-Peer Binding Canvas</text>
  <text x="440" y="98" fill="#94a3b8" font-family="Inter, sans-serif" font-weight="600" font-size="13">FT-10 &amp; Bandwidth Sizer</text>
  <text x="635" y="98" fill="#94a3b8" font-family="Inter, sans-serif" font-weight="600" font-size="13">10-Point Normative Auditor</text>
  <text x="835" y="98" fill="#94a3b8" font-family="Inter, sans-serif" font-weight="600" font-size="13">BACnet &amp; IP-852 Bridge</text>
  <text x="1035" y="98" fill="#94a3b8" font-family="Inter, sans-serif" font-weight="600" font-size="13">Python CLI</text>

  <!-- Left Main Card: Binding Canvas -->
  <rect x="30" y="140" width="670" height="495" rx="12" fill="url(#cardGrad)" stroke="#243452" stroke-width="1" />
  <text x="55" y="175" fill="#ffffff" font-family="Inter, sans-serif" font-weight="700" font-size="16">Decentralized Peer-to-Peer Network Variable Binding</text>
  <text x="585" y="175" fill="#10b981" font-family="Inter, sans-serif" font-weight="600" font-size="12">● Masterless Control</text>

  <!-- Canvas Simulation View -->
  <rect x="50" y="195" width="630" height="260" rx="8" fill="#060913" stroke="#243452" stroke-width="1" />

  <!-- FT-10 Channel Bus Line -->
  <line x1="70" y1="325" x2="650" y2="325" stroke="#38bdf8" stroke-width="4" />
  <text x="360" y="315" fill="#00f2fe" font-family="JetBrains Mono, monospace" font-weight="700" font-size="10" text-anchor="middle">FT-10 FREE TOPOLOGY BUS (78 kbps, 52.3 Ω TERMINATOR)</text>

  <!-- Node 1: Smart Thermostat -->
  <rect x="80" y="215" width="160" height="65" rx="6" fill="#12192c" stroke="#243452" stroke-width="1.5" />
  <text x="90" y="235" fill="#ffffff" font-family="Inter, sans-serif" font-weight="700" font-size="11">Smart Thermostat</text>
  <text x="90" y="252" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="10">Subnet/Node: 1/10</text>
  <text x="90" y="268" fill="#10b981" font-family="JetBrains Mono, monospace" font-size="10">nvoSpaceTemp: 21.5°C</text>
  <line x1="160" y1="280" x2="160" y2="325" stroke="#243452" stroke-width="2" />

  <!-- Node 2: VAV Damper Actuator -->
  <rect x="80" y="365" width="160" height="65" rx="6" fill="#12192c" stroke="#243452" stroke-width="1.5" />
  <text x="90" y="385" fill="#ffffff" font-family="Inter, sans-serif" font-weight="700" font-size="11">VAV Damper Actuator</text>
  <text x="90" y="402" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="10">Subnet/Node: 1/22</text>
  <text x="90" y="418" fill="#f59e0b" font-family="JetBrains Mono, monospace" font-size="10">nviSpaceTemp: Bound</text>
  <line x1="160" y1="365" x2="160" y2="325" stroke="#243452" stroke-width="2" />

  <!-- Node 3: Lighting Dual Switch -->
  <rect x="470" y="215" width="170" height="65" rx="6" fill="#12192c" stroke="#243452" stroke-width="1.5" />
  <text x="480" y="235" fill="#ffffff" font-family="Inter, sans-serif" font-weight="700" font-size="11">Dual Light Switch</text>
  <text x="480" y="252" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="10">Subnet/Node: 1/20</text>
  <text x="480" y="268" fill="#10b981" font-family="JetBrains Mono, monospace" font-size="10">nvoSwitch: ON (80%)</text>
  <line x1="555" y1="280" x2="555" y2="325" stroke="#243452" stroke-width="2" />

  <!-- Node 4: DALI Lighting Ballast -->
  <rect x="470" y="365" width="170" height="65" rx="6" fill="#12192c" stroke="#243452" stroke-width="1.5" />
  <text x="480" y="385" fill="#ffffff" font-family="Inter, sans-serif" font-weight="700" font-size="11">DALI Light Ballast</text>
  <text x="480" y="402" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="10">Subnet/Node: 1/30</text>
  <text x="480" y="418" fill="#f59e0b" font-family="JetBrains Mono, monospace" font-size="10">nviSwitch: Bound</text>
  <line x1="555" y1="365" x2="555" y2="325" stroke="#243452" stroke-width="2" />

  <!-- Binding Arrows -->
  <path d="M 240 250 Q 280 325 240 395" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="4" />
  <path d="M 470 250 Q 430 325 470 395" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4" />

  <!-- Lower Details Box -->
  <rect x="50" y="475" width="630" height="135" rx="6" fill="#060913" stroke="#243452" stroke-width="1" />
  <text x="70" y="500" fill="#00f2fe" font-family="JetBrains Mono, monospace" font-weight="700" font-size="11">[TX] 03 01 01 16 01 0F 01 3F 08 66 12 34 (ANSI/CTA-709.1)</text>
  <text x="70" y="522" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="10">• Standard: ANSI/CTA-709.1-D / LonMark Interoperability Guidelines v3.4</text>
  <text x="70" y="542" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="10">• NV Selector: 0x3F | SNVT: SNVT_temp_p (High-Res 0.01 Scale)</text>
  <text x="70" y="562" fill="#10b981" font-family="JetBrains Mono, monospace" font-size="10">• Decoded Value: 21.50 °C | Transport Service: Acknowledged (ACKD)</text>
  <text x="70" y="582" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="10">• Addressing: Subnet 1, Node 15 -> Subnet 1, Node 22 | CRC16: 0x1234 (VALID)</text>
  <text x="70" y="600" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="10">✓ Peer-to-Peer Autonomous Execution — No Central Polling Master Required</text>

  <!-- Right Side Cards: KPIs & Sizing -->
  <rect x="725" y="140" width="445" height="495" rx="12" fill="url(#cardGrad)" stroke="#243452" stroke-width="1" />
  <text x="750" y="175" fill="#ffffff" font-family="Inter, sans-serif" font-weight="700" font-size="16">Channel &amp; Normative Performance</text>

  <!-- KPI Badges -->
  <g transform="translate(750, 200)">
    <!-- Box 1 -->
    <rect x="0" y="0" width="190" height="85" rx="8" fill="#0d1426" stroke="#243452" stroke-width="1" />
    <text x="95" y="40" fill="#00f2fe" font-family="JetBrains Mono, monospace" font-weight="800" font-size="22" text-anchor="middle">21.5%</text>
    <text x="95" y="65" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">CSMA CHANNEL LOAD</text>

    <!-- Box 2 -->
    <rect x="205" y="0" width="190" height="85" rx="8" fill="#0d1426" stroke="#243452" stroke-width="1" />
    <text x="300" y="40" fill="#10b981" font-family="JetBrains Mono, monospace" font-weight="800" font-size="22" text-anchor="middle">+100 m</text>
    <text x="300" y="65" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">WIRE LENGTH MARGIN</text>

    <!-- Box 3 -->
    <rect x="0" y="100" width="190" height="85" rx="8" fill="#0d1426" stroke="#243452" stroke-width="1" />
    <text x="95" y="140" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-weight="800" font-size="22" text-anchor="middle">8.42 ms</text>
    <text x="95" y="165" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">ROUND-TRIP ACK TIME</text>

    <!-- Box 4 -->
    <rect x="205" y="100" width="190" height="85" rx="8" fill="#0d1426" stroke="#243452" stroke-width="1" />
    <text x="300" y="140" fill="#10b981" font-family="JetBrains Mono, monospace" font-weight="800" font-size="22" text-anchor="middle">100%</text>
    <text x="300" y="165" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">AUDIT COMPLIANCE</text>
  </g>

  <!-- CLI Code Preview -->
  <rect x="750" y="405" width="395" height="210" rx="8" fill="#060913" stroke="#243452" stroke-width="1" />
  <text x="765" y="430" fill="#00f2fe" font-family="JetBrains Mono, monospace" font-size="11">$ ./build/lonworks-cli.py encode --snvt SNVT_temp_p</text>
  <text x="765" y="450" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="10">03 01 01 16 01 0F 01 3F 08 66 12 34 (ACKD)</text>
  <text x="765" y="475" fill="#00f2fe" font-family="JetBrains Mono, monospace" font-size="11">$ ./build/lonworks-cli.py size --cable 400 --nodes 32</text>
  <text x="765" y="495" fill="#10b981" font-family="JetBrains Mono, monospace" font-size="10">[OK] Channel: FT-10 Free Topology (400m / 500m max)</text>
  <text x="765" y="515" fill="#10b981" font-family="JetBrains Mono, monospace" font-size="10">[OK] Bandwidth Load: 21.5% (Healthy &lt; 70%)</text>
  <text x="765" y="540" fill="#00f2fe" font-family="JetBrains Mono, monospace" font-size="11">$ ./build/lonworks-cli.py audit</text>
  <text x="765" y="560" fill="#ffffff" font-family="JetBrains Mono, monospace" font-size="10">[PASS] 10/10 Normative LonTalk Checks Verified</text>
  <text x="765" y="590" fill="#f59e0b" font-family="JetBrains Mono, monospace" font-size="10">● Ready for Echelon SmartServer, Distech, and Tridium JACE</text>
</svg>
